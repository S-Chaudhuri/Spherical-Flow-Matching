# @package _global_
data: general_fm
use_wandb: true

# --- Explicit MoG Arguments ---
general:
  manifold: poincare
  curvature: 1.0
  dim: 3
  x0_dist: gaussian
  x1_dist: MoG
  n_samples: 20000
  std_x0: 0.7
  mean_x0: [0.0, 0.0, 0.0]
  std_x1:
  - [0.3, 0.3, 0.3]
  - [0.5, 0.5, 0.5]
  mean_x1:
  - [0.8, 0.0, 0.0]
  - [-0.8, 0.0, 0.0]
  weights: [0.5, 0.5]
  origin: null
  normalize_tangent_distributions: false
metrics_used: {sinkhorn_knopp: true, tangent_sinkhorn_knopp: true, mmd: true, epsilon_coverage: true,
  epsilon_precision: true, frechet_variance: true, dispersion: true, radial: true,
  stability: true, rfm: true, cross_curvature: false, volume_scaling: true}
metrics_param: {sinkhorn_blur: 0.05, coverage_eps_multiplier: 1.0, normalize_tangent_sinkhorn: true}
save_densities: false
model: {d_model: 512, num_layers: 5, actfn: swish, fourier: null, atol: 1.0e-06, rtol: 1.0e-06,
  metric_normalize: true}

# --- Flow Matching Model Settings ---
optim: {num_iterations: 10000, batch_size: 512, val_batch_size: 2000, lr: 0.0001}

# --- Optimizer Settings ---
val_every: 500
early_stopping_patience: 1000
div_mode: rademacher
eval_projx: false
local_coords: false
normalize_loglik: false
visualize: true
eval_n_pairs: 100
eval_t_values: [0.0, 0.25, 0.5, 0.75, 1.0]
