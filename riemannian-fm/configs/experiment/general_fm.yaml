# @package _global_
data: general_fm
use_wandb: True

general:
  manifold: poincare
  curvature: 1.0
  dim: 3
  x0_dist: gaussian
  x1_dist: gaussian
  n_samples: 60000
  std_x0: 0.3
  std_x1: 0.3                           # set null for checkerboard
  mean_x0: [0.0, 0.0, 0.0]              
  mean_x1: [0.8, 0.0, 0.0]              # set null for checkerboard
  radius_x1: 1
  weights: null                         # for mixture of gaussians, define as list: [0.5, 0.5]
  origin: null 
                                        # if true, rescale all sampled x0/x1 points by
                                        # x -> exp_o((1/sqrt(curvature)) * log_o(x))
                                        # around the fixed origin o; this works for any distribution
  normalize_tangent_distributions: false

checkerboard:
  num_square: 4
  tangent_scale: 1.0

metrics_used:
  sinkhorn_knopp: True
  tangent_sinkhorn_knopp: True
  mmd: False
  epsilon_coverage: True
  epsilon_precision: True
  frechet_variance: True
  dispersion: True
  stability: True
  rfm: True
  volume_scaling: True

metrics_param:
  sinkhorn_blur: 0.05
  coverage_eps_multiplier: 1.0
  normalize_tangent_sinkhorn: true

save_densities: False

model:
  d_model: 1024
  num_layers: 8
  actfn: swish
  fourier: null
  atol: 1e-6
  rtol: 1e-6
  metric_normalize: True

optim:
  num_iterations: 20000
  batch_size: 512
  val_batch_size: 500
  lr: 1e-4

val_every: 100
early_stopping_patience: 400
div_mode: rademacher
eval_projx: False
local_coords: False
normalize_loglik: False
visualize: True

delete_checkpoints_after_use: False

eval_n_pairs: 2000 # if eval_n_pairs is equal to n_samples, then the fixed eval subset will be the same n pairs
eval_t_values: [0.0,0.2, 0.5, 0.8, 1.0]
save_artifacts: True
upload_fixed_eval: False  # upload general_dataset_fixed_eval.pt to WandB